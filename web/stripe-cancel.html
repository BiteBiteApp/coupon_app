<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Return to BiteStar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 48px;
      color: #d97706;
    }

    h1 {
      margin: 10px 0 0;
      font-size: 22px;
    }

    p {
      color: #555555;
      margin: 15px 0;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border: 1px solid transparent;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .btn-secondary {
      border-color: #cbd5e1;
      background: #ffffff;
      color: #1e3a8a;
    }

    .btn:focus-visible {
      outline: 3px solid #0f172a;
      outline-offset: 3px;
    }

    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 22rem) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .card {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div id="status-icon" class="icon" aria-hidden="true" hidden>↩</div>
    <h1 id="return-heading">Return to BiteStar</h1>
    <p id="return-message">This return link is unavailable.</p>
    <p id="return-instruction">Switch back to BiteStar to continue.</p>

    <div class="actions">
      <button class="btn" id="return-link" type="button" hidden disabled>
        Open BiteStar
      </button>
      <button
        class="btn btn-secondary"
        id="continue-on-web"
        type="button"
        hidden
        disabled
      >
        Continue on the web
      </button>
    </div>
    <p class="hint">
      If BiteStar does not open, use the web option or switch back to the app.
    </p>
  </main>
  <script>
    (() => {
      'use strict';

      const originalHref = window.location.href;
      window.history.replaceState(null, 'Return to BiteStar', '/stripe-cancel.html');

      const parameterName = 'return_token';
      const maximumUrlLength = 2048;
      const tokenPattern = /^[A-Za-z0-9_-]{43}$/;
      const heading = document.getElementById('return-heading');
      const message = document.getElementById('return-message');
      const instruction = document.getElementById('return-instruction');
      const statusIcon = document.getElementById('status-icon');
      const openButton = document.getElementById('return-link');
      const webButton = document.getElementById('continue-on-web');

      function parseReturnToken(rawHref) {
        if (
          typeof rawHref !== 'string' ||
          rawHref.length > maximumUrlLength ||
          rawHref.includes('#')
        ) {
          return null;
        }

        let url;
        try {
          url = new URL(rawHref);
        } catch (_) {
          return null;
        }

        const parameters = Array.from(url.searchParams.entries());
        if (
          parameters.length !== 1 ||
          parameters[0][0] !== parameterName
        ) {
          return null;
        }

        const token = parameters[0][1];
        if (!tokenPattern.test(token)) {
          return null;
        }

        if (url.search !== `?${parameterName}=${token}`) {
          return null;
        }

        return token;
      }

      function enableAction(button, destination) {
        button.hidden = false;
        button.disabled = false;
        button.addEventListener('click', () => {
          window.location.assign(destination);
        });
      }

      const token = parseReturnToken(originalHref);
      if (token === null) {
        return;
      }

      const returnUri =
        `bitesaver://subscription-cancel?${parameterName}=` +
        encodeURIComponent(token);
      const webReturnUri =
        'https://app.bitestar.app/#/subscription-return/' +
        `checkoutCancel?${parameterName}=` +
        encodeURIComponent(token);

      document.title = 'Subscription Canceled';
      heading.textContent = 'Subscription Canceled';
      message.textContent = 'No charge was made.';
      instruction.textContent = 'Tap below to return to BiteStar.';
      statusIcon.hidden = false;
      enableAction(openButton, returnUri);
      enableAction(webButton, webReturnUri);
    })();
  </script>
</body>
</html>
