<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Return to BiteStar</title>
  <link
    rel="canonical"
    href="https://app.bitestar.app/subscription/portal-return"
  >
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f6f3ed;
      color: #24170f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1rem, 5vw, 2.5rem);
      background:
        radial-gradient(circle at top, #fffaf0 0, transparent 52%),
        #f6f3ed;
    }

    main {
      width: min(100%, 32rem);
      padding: clamp(1.5rem, 6vw, 2.5rem);
      overflow-wrap: anywhere;
      background: #fffefc;
      border: 1px solid #efe1d1;
      border-radius: 1.5rem;
      box-shadow: 0 1rem 2.5rem rgba(64, 42, 22, 0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      color: #4f7d1f;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #5f8f25;
      box-shadow: inset 0 0 0 0.25rem #eaf2dc;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.35rem);
      line-height: 1.12;
    }

    p {
      margin: 1rem 0 0;
      color: #5e564a;
      font-size: 1rem;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.8rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.9rem;
      font-weight: 750;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
    }

    .button-primary {
      background: #4f7d1f;
      color: #ffffff;
    }

    .button-secondary {
      background: #fffaf2;
      border-color: #dfd1c1;
      color: #2b1d14;
    }

    .button:focus-visible {
      outline: 0.2rem solid #2f5bff;
      outline-offset: 0.2rem;
    }

    .note {
      font-size: 0.9rem;
    }

    @media (max-width: 22rem) {
      body {
        align-items: flex-start;
        padding: 0.75rem;
      }

      main {
        padding: 1.25rem;
        border-radius: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="BiteStar">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>BiteStar</span>
    </div>

    <h1>Back from subscription management</h1>
    <p>
      You have returned from managing your subscription. Open BiteStar to
      continue and refresh your current subscription status.
    </p>

    <div class="actions">
      <a
        id="open-bitestar"
        class="button button-primary"
        href="bitesaver://subscription-portal-return"
      >
        Open BiteStar
      </a>
      <a
        id="continue-on-web"
        class="button button-secondary"
        href="https://app.bitestar.app/"
      >
        Continue on the web
      </a>
    </div>

    <p class="note">
      If the app does not open, use the web option or switch back to BiteStar.
    </p>
  </main>
</body>
</html>
