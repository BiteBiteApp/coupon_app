<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Return to BiteStar</title>
  <link
    rel="canonical"
    href="https://app.bitestar.app/subscription/portal-return"
  >
  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f6f3ed;
      color: #24170f;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1rem, 5vw, 2.5rem);
      background:
        radial-gradient(circle at top, #fffaf0 0, transparent 52%),
        #f6f3ed;
    }

    main {
      width: min(100%, 32rem);
      padding: clamp(1.5rem, 6vw, 2.5rem);
      overflow-wrap: anywhere;
      background: #fffefc;
      border: 1px solid #efe1d1;
      border-radius: 1.5rem;
      box-shadow: 0 1rem 2.5rem rgba(64, 42, 22, 0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      color: #4f7d1f;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #5f8f25;
      box-shadow: inset 0 0 0 0.25rem #eaf2dc;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.35rem);
      line-height: 1.12;
    }

    p {
      margin: 1rem 0 0;
      color: #5e564a;
      font-size: 1rem;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.8rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.9rem;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
    }

    .button-primary {
      background: #4f7d1f;
      color: #ffffff;
    }

    .button-secondary {
      background: #fffaf2;
      border-color: #dfd1c1;
      color: #2b1d14;
    }

    .button:focus-visible {
      outline: 0.2rem solid #2f5bff;
      outline-offset: 0.2rem;
    }

    .note {
      font-size: 0.9rem;
    }

    @media (max-width: 22rem) {
      body {
        align-items: flex-start;
        padding: 0.75rem;
      }

      main {
        padding: 1.25rem;
        border-radius: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="BiteStar">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>BiteStar</span>
    </div>

    <h1 id="return-heading">Return to BiteStar</h1>
    <p id="return-message">This return link is unavailable.</p>

    <div class="actions">
      <button
        id="open-bitestar"
        class="button button-primary"
        type="button"
        hidden
        disabled
      >
        Open BiteStar
      </button>
      <button
        id="continue-on-web"
        class="button button-secondary"
        type="button"
        hidden
        disabled
      >
        Continue on the web
      </button>
    </div>

    <p class="note" id="return-instruction">
      Use the web option or switch back to BiteStar to continue.
    </p>
  </main>
  <script>
    (() => {
      'use strict';

      const originalHref = window.location.href;
      window.history.replaceState(
        null,
        'Return to BiteStar',
        '/subscription/portal-return'
      );

      const parameterName = 'return_token';
      const maximumUrlLength = 2048;
      const tokenPattern = /^[A-Za-z0-9_-]{43}$/;
      const heading = document.getElementById('return-heading');
      const message = document.getElementById('return-message');
      const instruction = document.getElementById('return-instruction');
      const openButton = document.getElementById('open-bitestar');
      const webButton = document.getElementById('continue-on-web');

      function parseReturnToken(rawHref) {
        if (
          typeof rawHref !== 'string' ||
          rawHref.length > maximumUrlLength ||
          rawHref.includes('#')
        ) {
          return null;
        }

        let url;
        try {
          url = new URL(rawHref);
        } catch (_) {
          return null;
        }

        const parameters = Array.from(url.searchParams.entries());
        if (
          parameters.length !== 1 ||
          parameters[0][0] !== parameterName
        ) {
          return null;
        }

        const token = parameters[0][1];
        if (!tokenPattern.test(token)) {
          return null;
        }

        if (url.search !== `?${parameterName}=${token}`) {
          return null;
        }

        return token;
      }

      function enableAction(button, destination) {
        button.hidden = false;
        button.disabled = false;
        button.addEventListener('click', () => {
          window.location.assign(destination);
        });
      }

      const token = parseReturnToken(originalHref);
      if (token === null) {
        return;
      }

      const returnUri =
        `bitesaver://subscription-portal-return?${parameterName}=` +
        encodeURIComponent(token);
      const webReturnUri =
        'https://app.bitestar.app/#/subscription-return/' +
        `customerPortal?${parameterName}=` +
        encodeURIComponent(token);

      document.title = 'Back from subscription management';
      heading.textContent = 'Back from subscription management';
      message.textContent =
        'You have returned from managing your subscription. Open BiteStar ' +
        'to continue and refresh your current subscription status.';
      instruction.textContent =
        'If the app does not open, use the web option or switch back to ' +
        'BiteStar.';
      enableAction(openButton, returnUri);
      enableAction(webButton, webReturnUri);
    })();
  </script>
</body>
</html>
